name: Automate Issue Labels
on:
    issues:
        types: [opened]

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    label-issue:
        runs-on: [ubuntu-latest]
        if: github.repository == 'nodejs-boot/nonna'
        steps:
            - name: View context attributes
              uses: actions/github-script@v6
              with:
                  script: |
                      const keywords = {
                        'compiler|aot|codegen|scanner|typechecker': 'compiler',
                        'di|injector|container|token|resolution': 'di',
                        'react|hooks|provider': 'react',
                        'vue|composables': 'vue',
                        'svelte': 'svelte',
                        'web-components|custom elements|lit|context-protocol': 'web-components',
                        'stencil': 'stencil',
                        'vite|plugin': 'vite-plugin',
                        'sample|example': 'samples',
                        'RFC': 'rfc',
                        'architecture|arch': 'architecture',
                        'cicd|github|workflow': 'cicd',
                        'doc|documentation|readme': 'documentation',
                      };

                      const labels = Object.entries(keywords)
                        .map(([regexp, label]) => {
                          if (new RegExp(regexp, 'gi').test(context.payload.issue.title)) {
                            return label;
                          }
                        })
                        .filter(Boolean);

                      if(!labels.length) {
                        return;
                      }

                      github.rest.issues.addLabels({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        labels
                      });
